<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Live Translator</title>
<script src="https://meet.jit.si/external_api.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 font-family:Arial,sans-serif;
 background:#edf3fa;color:#17243a
}
.container{
 max-width:650px;margin:20px auto;
 background:white;padding:22px;
 border-radius:18px;
 box-shadow:0 4px 20px #0002
}
h1,h2{text-align:center;color:#0759b5}
.subtitle{text-align:center;color:#666}
label{display:block;margin-top:17px;font-weight:bold}
select,textarea,input{
 width:100%;padding:13px;margin-top:8px;
 border:1px solid #bbb;border-radius:9px;
 font-size:16px
}
textarea{min-height:110px}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:9px;
 background:#0759b5;color:white;
 font-size:16px;font-weight:bold
}
.swap{background:#53677e}
.mic{background:#07864c}
.stop{background:#d93636}
.speak{background:#753bbd}
.result{
 background:#f0f6ff;padding:15px;
 min-height:90px;margin-top:10px;
 border-radius:9px;font-size:18px;
 overflow-wrap:anywhere
}
.status{text-align:center;margin-top:15px;color:#07864c}
#meet{width:100%;min-height:400px;margin-top:15px}
.note{text-align:center;font-size:13px;color:#777}
</style>
</head>

<body>
<div class="container">

<h1>🌍 Smart Live Translator</h1>
<p class="subtitle">বাংলা, ইংরেজি, জার্মান ও স্প্যানিশ অনুবাদক</p>

<label>যে ভাষায় কথা বলবেন</label>
<select id="from">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="de">Deutsch - German</option>
<option value="es">Español - Spanish</option>
</select>

<button class="swap" onclick="swapLanguages()">⇅ ভাষা পরিবর্তন</button>

<label>যে ভাষায় অনুবাদ চান</label>
<select id="to">
<option value="en">English</option>
<option value="de">Deutsch - German</option>
<option value="es">Español - Spanish</option>
<option value="bn">বাংলা</option>
</select>

<label>আপনার কথা</label>
<textarea id="speech" placeholder="এখানে লিখুন অথবা মাইক্রোফোনে কথা বলুন"></textarea>

<button class="mic" onclick="startSpeech()">🎤 কথা বলা শুরু করুন</button>
<button class="stop" onclick="stopSpeech()">⏹ কথা বলা বন্ধ করুন</button>
<button onclick="translateText()">🌐 অনুবাদ করুন</button>

<label>অনুবাদের ফলাফল</label>
<div id="translationResult" class="result">অনুবাদ এখানে দেখা যাবে</div>

<button class="speak" onclick="speakTranslation()">🔊 অনুবাদ শুনুন</button>
<button class="swap" onclick="clearText()">🗑 লেখা মুছুন</button>

<div id="status" class="status">Ready</div>

<hr>

<h2>📞 অডিও ও ভিডিও কল</h2>

<label>আপনার নাম</label>
<input id="userName" placeholder="আপনার নাম লিখুন">

<label>মিটিং রুম কোড</label>
<input id="roomCode" placeholder="রুম কোড লিখুন">

<button onclick="createRoom()">➕ নতুন রুম তৈরি করুন</button>
<button onclick="joinAudio()">📞 অডিও কল</button>
<button onclick="joinVideo()">🎥 ভিডিও কল</button>

<div id="meetingStatus" class="status">মিটিং শুরু হয়নি</div>
<div id="meet"></div>

<button class="stop" onclick="endMeeting()">⏹ কল বন্ধ করুন</button>

<p class="note">Smart Live Translator | Version 6.0</p>
</div>

<script>
let recognition=null;
let lastTranslation="";
let meetingAPI=null;
let translationQueue=Promise.resolve();

const speechLanguages={
 bn:"bn-BD",
 en:"en-US",
 de:"de-DE",
 es:"es-ES"
};

function swapLanguages(){
 const f=document.getElementById("from");
 const t=document.getElementById("to");
 const old=f.value;
 f.value=t.value;
 t.value=old;
 lastTranslation="";
 document.getElementById("translationResult").innerText=
 "অনুবাদ এখানে দেখা যাবে";
}

async function googleTranslate(text,from,to){

 const params=new URLSearchParams({
  client:"gtx",
  sl:from,
  tl:to,
  dt:"t",
  q:text
 });

 const url=
 "https://translate.googleapis.com/translate_a/single?"+
 params.toString();

 const response=await fetch(url);

 if(!response.ok){
  throw new Error("Translation server error");
 }

 const data=await response.json();

 if(!Array.isArray(data)||!Array.isArray(data[0])){
  throw new Error("Invalid translation");
 }

 const translated=data[0]
 .map(item=>item&&item[0]?item[0]:"")
 .join("");

 if(!translated.trim()){
  throw new Error("Empty translation");
 }

 return translated;
}

async function translateText(){

 const text=document.getElementById("speech").value.trim();

 if(!text){
  alert("আগে কিছু লিখুন।");
  return;
 }

 await translateAndSpeak(text);
}

function translateAndSpeak(text){

 const task=translationQueue.then(async()=>{

  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;

  if(from===to){
   document.getElementById("status").innerText=
   "দুটি ভিন্ন ভাষা নির্বাচন করুন";
   return;
  }

  if(text.length>450){
   document.getElementById("status").innerText=
   "একবারে ৪৫০ অক্ষরের কম লিখুন";
   return;
  }

  document.getElementById("status").innerText=
  "অনুবাদ হচ্ছে...";

  try{

   const result=await googleTranslate(text,from,to);

   lastTranslation=result;

   document.getElementById("translationResult").innerText=result;

   document.getElementById("status").innerText=
   "অনুবাদ সম্পন্ন";

   speakTranslation();

  }catch(error){

   document.getElementById("status").innerText=
   "অনুবাদ ব্যর্থ হয়েছে";

   console.error(error);

  }

 });

 translationQueue=task.catch(()=>{});

 return task;
}

function startSpeech(){

 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){
  alert("Google Chrome ব্যবহার করুন।");
  return;
 }

 if(recognition){
  recognition.abort();
 }

 recognition=new SR();

 recognition.lang=
 speechLanguages[document.getElementById("from").value];

 recognition.continuous=true;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  document.getElementById("status").innerText=
  "🎤 আপনার কথা শুনছি...";
 };

 recognition.onresult=(event)=>{

  for(let i=event.resultIndex;i<event.results.length;i++){

   if(event.results[i].isFinal){

    const text=event.results[i][0].transcript.trim();

    if(text){

     const box=document.getElementById("speech");

     box.value+=(box.value?" ":"")+text;

     translateAndSpeak(text);
    }
   }
  }
 };

 recognition.onerror=(event)=>{
  document.getElementById("status").innerText=
  "Microphone: "+event.error;
 };

 recognition.onend=()=>{
  document.getElementById("status").innerText=
  "শোনা বন্ধ হয়েছে";
 };

 try{
  recognition.start();
 }catch(e){
  document.getElementById("status").innerText=
  "মাইক্রোফোন চালু করা যায়নি";
 }
}

function stopSpeech(){

 if(recognition){
  recognition.stop();
 }

 window.speechSynthesis.cancel();

 document.getElementById("status").innerText=
 "কথা বলা বন্ধ হয়েছে";
}

function speakTranslation(){

 if(!lastTranslation){
  alert("আগে অনুবাদ করুন।");
  return;
 }

 window.speechSynthesis.cancel();

 const voice=new SpeechSynthesisUtterance(lastTranslation);

 voice.lang=speechLanguages[
 document.getElementById("to").value
 ];

 voice.rate=0.9;

 window.speechSynthesis.speak(voice);
}

function clearText(){

 document.getElementById("speech").value="";

 document.getElementById("translationResult").innerText=
 "অনুবাদ এখানে দেখা যাবে";

 lastTranslation="";

 window.speechSynthesis.cancel();

 document.getElementById("status").innerText="Ready";
}

function createRoom(){

 const room="SmartLive-"+
 Math.random().toString(36).substring(2,12);

 document.getElementById("roomCode").value=room;

 alert("রুম কোড: "+room);
}

function joinAudio(){
 startMeeting(true);
}

function joinVideo(){
 startMeeting(false);
}

function startMeeting(audioOnly){

 const room=document.getElementById("roomCode").value.trim();
 const name=document.getElementById("userName").value.trim();

 if(!room||!name){
  alert("নাম ও রুম কোড লিখুন।");
  return;
 }

 if(typeof JitsiMeetExternalAPI==="undefined"){
  alert("মিটিং সার্ভার পাওয়া যাচ্ছে না।");
  return;
 }

 if(meetingAPI){
  meetingAPI.dispose();
 }

 document.getElementById("meet").innerHTML="";

 meetingAPI=new JitsiMeetExternalAPI("meet.jit.si",{
  roomName:room,
  width:"100%",
  height:400,
  parentNode:document.getElementById("meet"),
  userInfo:{displayName:name},
  configOverwrite:{
   startWithAudioMuted:false,
   startWithVideoMuted:audioOnly
  }
 });

 document.getElementById("meetingStatus").innerText=
 "মিটিং সংযোগ হচ্ছে...";

 meetingAPI.addListener("videoConferenceJoined",()=>{
  document.getElementById("meetingStatus").innerText=
  "মিটিং চালু হয়েছে";
 });
}

function endMeeting(){

 if(meetingAPI){
  meetingAPI.dispose();
  meetingAPI=null;
 }

 document.getElementById("meet").innerHTML="";

 document.getElementById("meetingStatus").innerText=
 "মিটিং শেষ হয়েছে";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Live Translator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #edf3fa;
  color: #17243a;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 20px #0002;
}

h1 {
  text-align: center;
  color: #0759b5;
  font-size: 26px;
}

.subtitle {
  text-align: center;
  color: #666;
}

label {
  display: block;
  margin-top: 17px;
  font-weight: bold;
}

select, textarea {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #bbb;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #0759b5;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

.swap {
  background: #53677e;
}

.mic {
  background: #07864c;
}

.stop {
  background: #d93636;
}

.speak {
  background: #753bbd;
}

.result {
  background: #f0f6ff;
  padding: 15px;
  min-height: 90px;
  margin-top: 10px;
  border-radius: 9px;
  overflow-wrap: anywhere;
  font-size: 18px;
}

.status {
  text-align: center;
  margin-top: 15px;
  color: #07864c;
  font-weight: bold;
}

.note {
  font-size: 13px;
  color: #777;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 Smart Live Translator</h1>

<p class="subtitle">
চার ভাষায় কথা বলুন এবং অনুবাদ শুনুন
</p>

<label>যে ভাষায় কথা বলবেন</label>

<select id="from">
<option value="bn-BD">বাংলা</option>
<option value="en-US">English</option>
<option value="de-DE">Deutsch (German)</option>
<option value="es-ES">Español (Spanish)</option>
</select>

<button class="swap" onclick="swapLanguages()">
⇅ ভাষা পরিবর্তন করুন
</button>

<label>যে ভাষায় অনুবাদ চান</label>

<select id="to">
<option value="en-US">English</option>
<option value="bn-BD">বাংলা</option>
<option value="de-DE">Deutsch (German)</option>
<option value="es-ES">Español (Spanish)</option>
</select>

<label>আপনার কথা</label>

<textarea id="speech"
placeholder="মাইক্রোফোনে কথা বললে এখানে লেখা আসবে..."></textarea>

<button class="mic" onclick="startSpeech()">
🎤 কথা বলা শুরু করুন
</button>

<button class="stop" onclick="stopSpeech()">
⏹ কথা বলা বন্ধ করুন
</button>

<button onclick="translateText()">
🌐 অনুবাদ করুন
</button>

<label>অনুবাদের ফলাফল</label>

<div id="translationResult" class="result">
অনুবাদ এখানে দেখা যাবে
</div>

<button class="speak" onclick="speakTranslation()">
🔊 অনুবাদ শুনুন
</button>

<button class="swap" onclick="clearText()">
🗑 লেখা মুছুন
</button>

<div id="status" class="status">
Ready
</div>

<p class="note">
Smart Live Translator | Version 2.0
</p>

</div>

<script>

let recognition = null;
let lastTranslation = "";

function languageCode(value) {
  return value.split("-")[0];
}

function swapLanguages() {

  const from = document.getElementById("from");
  const to = document.getElementById("to");

  const oldFrom = from.value;
  from.value = to.value;
  to.value = oldFrom;
}

function startSpeech() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SR) {
    alert("আপনার ব্রাউজার Speech Recognition সমর্থন করছে না। Chrome ব্যবহার করুন।");
    return;
  }

  if (recognition) {
    recognition.abort();
  }

  recognition = new SR();

  recognition.lang =
    document.getElementById("from").value;

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("status").innerText =
      "🎤 Listening...";
  };

  recognition.onresult = function(event) {

    let newText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (event.results[i].isFinal) {
        newText += event.results[i][0].transcript + " ";
      }
    }

    if (newText.trim()) {

      const box = document.getElementById("speech");

      box.value += newText;

      translateAndSpeak(newText.trim());
    }
  };

  recognition.onerror = function(event) {

    document.getElementById("status").innerText =
      "Microphone error: " + event.error;
  };

  recognition.onend = function() {

    document.getElementById("status").innerText =
      "Listening stopped";
  };

  try {
    recognition.start();
  } catch(error) {
    document.getElementById("status").innerText =
      "Microphone could not start";
  }
}

function stopSpeech() {

  if (recognition) {
    recognition.stop();
  }

  window.speechSynthesis.cancel();

  document.getElementById("status").innerText =
    "Stopped";
}

async function translateText() {

  const text =
    document.getElementById("speech").value.trim();

  if (!text) {
    alert("আগে কিছু কথা বলুন অথবা লিখুন।");
    return;
  }

  await translateAndSpeak(text);
}

async function translateAndSpeak(text) {

  const from =
    languageCode(document.getElementById("from").value);

  const to =
    languageCode(document.getElementById("to").value);

  if (from === to) {
    alert("দুটি ভিন্ন ভাষা নির্বাচন করুন।");
    return;
  }

  document.getElementById("status").innerText =
    "Translating...";

  try {

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + from + "|" + to;

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Translation server error");
    }

    const data = await response.json();

    if (
      data.responseStatus !== 200 ||
      !data.responseData ||
      !data.responseData.translatedText
    ) {
      throw new Error("Translation unavailable");
    }

    lastTranslation =
      data.responseData.translatedText;

    document.getElementById("translationResult").innerText =
      lastTranslation;

    document.getElementById("status").innerText =
      "Translation successful";

    speakTranslation();

  } catch(error) {

    document.getElementById("status").innerText =
      "Translation failed";

    alert("অনুবাদ করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করুন।");
  }
}

function speakTranslation() {

  if (!lastTranslation) {
    alert("আগে অনুবাদ করুন।");
    return;
  }

  window.speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(lastTranslation);

  voice.lang =
    document.getElementById("to").value;

  voice.rate = 0.9;

  window.speechSynthesis.speak(voice);
}
let meetingAPI = null;

function createRoom() {

  const room =
    "SmartLive-" +
    Math.random().toString(36).substring(2, 12);

  document.getElementById("roomCode").value = room;

  alert("আপনার মিটিং রুম কোড: " + room);
}

function joinAudio() {
  startMeeting(true);
}

function joinVideo() {
  startMeeting(false);
}

function startMeeting(audioOnly) {

  const room =
    document.getElementById("roomCode").value.trim();

  const name =
    document.getElementById("userName").value.trim();

  if (!room || !name) {
    alert("নাম এবং মিটিং রুম কোড লিখুন।");
    return;
  }

  if (typeof JitsiMeetExternalAPI === "undefined") {
    alert("মিটিং সার্ভার সংযোগ হচ্ছে না।");
    return;
  }

  if (meetingAPI) {
    meetingAPI.dispose();
  }

  document.getElementById("meet").innerHTML = "";

  const options = {

    roomName: room,

    width: "100%",
    height: 500,

    parentNode:
      document.getElementById("meet"),

    userInfo: {
      displayName: name
    },

    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: audioOnly
    }
  };

  meetingAPI =
    new JitsiMeetExternalAPI(
      "meet.jit.si",
      options
    );

  document.getElementById("meetingStatus").innerText =
    "মিটিং সংযোগ হচ্ছে...";
  
  meetingAPI.addListener(
    "videoConferenceJoined",
    function() {
      document.getElementById("meetingStatus").innerText =
        "আপনি মিটিংয়ে যুক্ত হয়েছেন";
    }
  );
}

function endMeeting() {

  if (meetingAPI) {
    meetingAPI.dispose();
    meetingAPI = null;
  }

  document.getElementById("meet").innerHTML = "";

  document.getElementById("meetingStatus").innerText =
    "মিটিং শেষ হয়েছে";
}
function clearText() {

  document.getElementById("speech").value = "";

  document.getElementById("translationResult").innerText =
    "অনুবাদ এখানে দেখা যাবে";

  lastTranslation = "";

  window.speechSynthesis.cancel();

  document.getElementById("status").innerText =
    "Ready";
}
<script src="https://meet.jit.si/external_api.js"></script>
</script>

</body>
</html>

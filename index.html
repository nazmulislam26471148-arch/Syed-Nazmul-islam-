<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Live Translator</title>

<script src="https://meet.jit.si/external_api.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #edf3fa;
  color: #17243a;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 20px #0002;
}

h1, h2 {
  text-align: center;
  color: #0759b5;
}

.subtitle {
  text-align: center;
  color: #666;
}

label {
  display: block;
  margin-top: 17px;
  font-weight: bold;
}

select, textarea, input {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #bbb;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #0759b5;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: .8;
}

.swap { background: #53677e; }
.mic { background: #07864c; }
.stop { background: #d93636; }
.speak { background: #753bbd; }

.result {
  background: #f0f6ff;
  padding: 15px;
  min-height: 90px;
  margin-top: 10px;
  border-radius: 9px;
  overflow-wrap: anywhere;
  font-size: 18px;
}

.status {
  text-align: center;
  margin-top: 15px;
  color: #07864c;
  font-weight: bold;
}

.note {
  font-size: 13px;
  color: #777;
  text-align: center;
  margin-top: 20px;
}

#meet {
  width: 100%;
  min-height: 400px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 Smart Live Translator</h1>

<p class="subtitle">
চার ভাষায় কথা বলুন এবং অনুবাদ শুনুন
</p>

<label>যে ভাষায় কথা বলবেন</label>

<select id="from">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<button class="swap" onclick="swapLanguages()">
⇅ ভাষা পরিবর্তন করুন
</button>

<label>যে ভাষায় অনুবাদ চান</label>

<select id="to">
<option value="en">English</option>
<option value="bn">বাংলা</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<label>আপনার কথা</label>

<textarea id="speech"
placeholder="এখানে লিখুন অথবা মাইক্রোফোনে কথা বলুন"></textarea>

<button class="mic" onclick="startSpeech()">
🎤 কথা বলা শুরু করুন
</button>

<button class="stop" onclick="stopSpeech()">
⏹ কথা বলা বন্ধ করুন
</button>

<button onclick="translateText()">
🌐 অনুবাদ করুন
</button>

<label>অনুবাদের ফলাফল</label>

<div id="translationResult" class="result">
অনুবাদ এখানে দেখা যাবে
</div>

<button class="speak" onclick="speakTranslation()">
🔊 অনুবাদ শুনুন
</button>

<button class="swap" onclick="clearText()">
🗑 লেখা মুছুন
</button>

<div id="status" class="status">Ready</div>

<hr>

<h2>📞 অডিও ও ভিডিও কল</h2>

<label>আপনার নাম</label>

<input id="userName"
type="text"
placeholder="আপনার নাম লিখুন">

<label>মিটিং রুম কোড</label>

<input id="roomCode"
type="text"
placeholder="রুম কোড লিখুন">

<button onclick="createRoom()">
➕ নতুন মিটিং রুম তৈরি করুন
</button>

<button onclick="joinAudio()">
📞 অডিও কলে যোগ দিন
</button>

<button onclick="joinVideo()">
🎥 ভিডিও কনফারেন্সে যোগ দিন
</button>

<div id="meetingStatus" class="status">
মিটিং শুরু হয়নি
</div>

<div id="meet"></div>

<button class="stop" onclick="endMeeting()">
⏹ কল বন্ধ করুন
</button>

<p class="note">
Smart Live Translator | Version 4.0
</p>

</div>

<script>

let recognition = null;
let lastTranslation = "";
let meetingAPI = null;
let translationBusy = false;

function languageCode(value) {
  return value;
}

function swapLanguages() {

  const from = document.getElementById("from");
  const to = document.getElementById("to");

  const old = from.value;

  from.value = to.value;
  to.value = old;
}

function startSpeech() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SR) {
    alert("Google Chrome ব্যবহার করুন।");
    return;
  }

  if (recognition) {
    recognition.abort();
  }

  recognition = new SR();

  const languages = {
    bn: "bn-BD",
    en: "en-US",
    de: "de-DE",
    es: "es-ES"
  };

  recognition.lang =
    languages[document.getElementById("from").value];

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = function() {

    document.getElementById("status").innerText =
      "🎤 Listening...";
  };

  recognition.onresult = function(event) {

    let text = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript + " ";
      }
    }

    if (text.trim()) {

      const box = document.getElementById("speech");

      box.value += text;

      translateAndSpeak(text.trim());
    }
  };

  recognition.onerror = function(event) {

    document.getElementById("status").innerText =
      "Microphone error: " + event.error;
  };

  recognition.onend = function() {

    document.getElementById("status").innerText =
      "Listening stopped";
  };

  try {
    recognition.start();
  } catch(error) {

    document.getElementById("status").innerText =
      "Microphone could not start";
  }
}

function stopSpeech() {

  if (recognition) {
    recognition.stop();
  }

  window.speechSynthesis.cancel();

  document.getElementById("status").innerText =
    "Stopped";
}

async function translateText() {

  const text =
    document.getElementById("speech").value.trim();

  if (!text) {

    alert("আগে কিছু লিখুন অথবা কথা বলুন।");
    return;
  }

  await translateAndSpeak(text);
}

async function translateAndSpeak(text) {

  if (translationBusy) return;

  const from = languageCode(
    document.getElementById("from").value
  );

  const to = languageCode(
    document.getElementById("to").value
  );

  if (from === to) {

    alert("দুটি ভিন্ন ভাষা নির্বাচন করুন।");
    return;
  }

  if (text.length > 450) {

    alert("একবারে ৪৫০ অক্ষরের কম লিখুন।");
    return;
  }

  translationBusy = true;

  const status = document.getElementById("status");

  status.innerText = "অনুবাদ হচ্ছে...";

  try {

    const params = new URLSearchParams();

    params.append("q", text);
    params.append("langpair", from + "|" + to);

    const response = await fetch(
      "https://api.mymemory.translated.net/get?" +
      params.toString()
    );

    if (!response.ok) {

      throw new Error("Server error");
    }

    const data = await response.json();

    if (
      Number(data.responseStatus) !== 200 ||
      !data.responseData ||
      !data.responseData.translatedText
    ) {

      throw new Error(
        data.responseDetails || "Translation unavailable"
      );
    }

    lastTranslation =
      data.responseData.translatedText;

    document.getElementById("translationResult").innerText =
      lastTranslation;

    status.innerText = "অনুবাদ সফল হয়েছে";

    speakTranslation();

  } catch(error) {

    status.innerText = "অনুবাদ ব্যর্থ";

    alert(
      "অনুবাদ করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।"
    );

  } finally {

    translationBusy = false;
  }
}

function speakTranslation() {

  if (!lastTranslation) {

    alert("আগে অনুবাদ করুন।");
    return;
  }

  window.speechSynthesis.cancel();

  const languages = {
    bn: "bn-BD",
    en: "en-US",
    de: "de-DE",
    es: "es-ES"
  };

  const voice =
    new SpeechSynthesisUtterance(lastTranslation);

  voice.lang =
    languages[document.getElementById("to").value];

  voice.rate = 0.9;

  window.speechSynthesis.speak(voice);
}

function clearText() {

  document.getElementById("speech").value = "";

  document.getElementById("translationResult").innerText =
    "অনুবাদ এখানে দেখা যাবে";

  lastTranslation = "";

  window.speechSynthesis.cancel();

  document.getElementById("status").innerText =
    "Ready";
}

function createRoom() {

  const room =
    "SmartLive-" +
    Math.random().toString(36).substring(2, 12);

  document.getElementById("roomCode").value = room;

  alert("আপনার মিটিং রুম কোড: " + room);
}

function joinAudio() {
  startMeeting(true);
}

function joinVideo() {
  startMeeting(false);
}

function startMeeting(audioOnly) {

  const room =
    document.getElementById("roomCode").value.trim();

  const name =
    document.getElementById("userName").value.trim();

  if (!room || !name) {

    alert("নাম এবং রুম কোড লিখুন।");
    return;
  }

  if (typeof JitsiMeetExternalAPI === "undefined") {

    alert("মিটিং সার্ভার সংযোগ হচ্ছে না।");
    return;
  }

  if (meetingAPI) {
    meetingAPI.dispose();
  }

  document.getElementById("meet").innerHTML = "";

  meetingAPI = new JitsiMeetExternalAPI(
    "meet.jit.si",
    {
      roomName: room,
      width: "100%",
      height: 400,

      parentNode:
        document.getElementById("meet"),

      userInfo: {
        displayName: name
      },

      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: audioOnly
      }
    }
  );

  document.getElementById("meetingStatus").innerText =
    "মিটিং সংযোগ হচ্ছে...";

  meetingAPI.addListener(
    "videoConferenceJoined",
    function() {

      document.getElementById("meetingStatus").innerText =
        "আপনি মিটিংয়ে যুক্ত হয়েছেন";
    }
  );
}

function endMeeting() {

  if (meetingAPI) {

    meetingAPI.dispose();
    meetingAPI = null;
  }

  document.getElementById("meet").innerHTML = "";

  document.getElementById("meetingStatus").innerText =
    "মিটিং শেষ হয়েছে";
}

</script>

</body>
</html>

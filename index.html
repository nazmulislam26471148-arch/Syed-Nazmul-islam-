<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldTalk AI</title>
<style>
body{margin:0;font-family:Arial;background:#eef3f9;color:#17324d}
header{background:#123c69;color:white;text-align:center;padding:25px}
main{max-width:600px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:14px;box-shadow:0 2px 10px #0001}
button,select,textarea{width:100%;padding:13px;margin:8px 0;border-radius:8px;font-size:16px}
button{background:#1264a3;color:white;border:0}
.green{background:#16834a}
textarea{height:100px;box-sizing:border-box}
</style>
</head>
<body>

<header>
<h1>🌍 WorldTalk AI</h1>
<p>Connect The World Without Language Barriers</p>
</header>

<main>

<div class="card">
<h2>🌐 Language Translation</h2>

<label>আপনার ভাষা</label>
<select id="from">
<option value="bn-BD">বাংলা</option>
<option value="en-US">English</option>
<option value="de-DE">German</option>
  <option value="es-ES">Spanish</option>
<option value="ar-SA">Arabic</option>
<option value="hi-IN">Hindi</option>
</select>

<label>অন্য ভাষা</label>
  <select id="to">
<option value="en-US">English</option>
<option value="bn-BD">বাংলা</option>
<option value="de-DE">German (Deutsch)</option>
<option value="es-ES">Spanish (Español)</option>
<option value="ar-SA">Arabic (العربية)</option>
<option value="hi-IN">Hindi (हिन्दी)</option>
<option value="fr-FR">French (Français)</option>
<option value="ja-JP">Japanese (日本語)</option>
  </select>
<option value="en-US">English</option>
<option value="bn-BD">বাংলা</option>
<option value="de-DE">German</option>
<option value="ar-SA">Arabic</option>
<option value="hi-IN">Hindi</option>
</select>

<textarea id="speech" placeholder="এখানে আপনার কথা দেখা যাবে"></textarea>

<button onclick="startSpeech()">🎤 কথা বলা শুরু করুন</button>
<button onclick="stopSpeech()">⏹ বন্ধ করুন</button>

<p id="status">প্রস্তুত</p>
</div>

<div class="card">
<h2>🎥 Video Conference</h2>
<p>সর্বোচ্চ ১০ জনের কনফারেন্সের লক্ষ্য।</p>
<button class="green" onclick="window.open('https://meet.google.com/new','_blank')">
Google Meet খুলুন
</button>
</div>

<div class="card">
<h2>🔐 Security</h2>
<p>নিরাপদ যোগাযোগ আমাদের প্রধান লক্ষ্য।</p>
</div>

</main>

<script>
let recognition;

function startSpeech(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SR){
alert("এই ব্রাউজারে Speech Recognition সমর্থিত নয়।");
return;
}

recognition=new SR();
recognition.lang=document.getElementById("from").value;
recognition.continuous=true;
recognition.interimResults=true;

recognition.onresult=function(e){
let result="";
for(let i=0;i<e.results.length;i++){
result+=e.results[i][0].transcript+" ";
}
document.getElementById("speech").value=result;
};

recognition.onstart=()=>{
document.getElementById("status").innerText="Listening...";
};

recognition.onerror=()=>{
document.getElementById("status").innerText="Microphone error";
};

recognition.start();
}

function stopSpeech(){
if(recognition){
recognition.stop();
document.getElementById("status").innerText="Stopped";
}
}
</script>
<script>
async function translateAndSpeak(text) {
  const target = document.getElementById("targetLanguage").value;

  try {
    const url = "https://api.mymemory.translated.net/get?q="
      + encodeURIComponent(text)
      + "&langpair=bn|" + target;

    const response = await fetch(url);
    const data = await response.json();

    const translated = data.responseData.translatedText;

    document.getElementById("translationResult").innerText = translated;

    const speech = new SpeechSynthesisUtterance(translated);
    speech.lang = target === "de" ? "de-DE"
      : target === "es" ? "es-ES" : "en-US";

    speechSynthesis.speak(speech);

  } catch (error) {
    alert("অনুবাদ করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করুন।");
  }
}
</script>
  <script>
function startSpeech() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

  recognition.lang = "bn-BD";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[event.results.length - 1][0].transcript;

    document.getElementById("speech").value = text;

    translateAndSpeak(text);
  };

  recognition.start();

  window.currentRecognition = recognition;
}

function stopSpeech() {
  if (window.currentRecognition) {
    window.currentRecognition.stop();
  }
}
</script>
</body>
</html>

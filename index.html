<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Live Translator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #222;
}

.container {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #ccc;
}

h1 {
  text-align: center;
  color: #0759a5;
}

.subtitle {
  text-align: center;
  color: #555;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

select, textarea, input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #0866c6;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  opacity: .7;
}

.green {
  background: #159447;
}

.orange {
  background: #e67e22;
}

.red {
  background: #c0392b;
}

.section {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

#status {
  text-align: center;
  margin-top: 12px;
  color: #087a37;
  font-weight: bold;
  overflow-wrap: anywhere;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 Smart Live Translator</h1>

<p class="subtitle">
চার ভাষায় কথা বলুন এবং অনুবাদ শুনুন
</p>

<label>আপনার ভাষা</label>

<select id="source">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<label>যে ভাষায় অনুবাদ চান</label>

<select id="target">
<option value="en">English</option>
<option value="bn">বাংলা</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<button onclick="swapLanguages()">
🔄 ভাষা পরিবর্তন
</button>

<label>আপনার কথা অথবা লেখা</label>

<textarea id="input"
placeholder="এখানে লিখুন অথবা মাইক্রোফোনে কথা বলুন"></textarea>

<button onclick="translateText()">
🌐 অনুবাদ করুন
</button>

<button class="green" onclick="startVoice()">
🎤 কথা বলুন
</button>

<button class="red" onclick="stopVoice()">
⏹ কথা বলা বন্ধ
</button>

<label>অনুবাদের ফলাফল</label>

<textarea id="output"
readonly
placeholder="অনুবাদ এখানে দেখা যাবে"></textarea>

<button class="orange" onclick="speakText()">
🔊 অনুবাদ শুনুন
</button>

<button onclick="copyText()">
📋 কপি করুন
</button>

<div id="status">প্রস্তুত</div>

<div class="section">

<h2>📞 অডিও ও ভিডিও কল</h2>

<p>
একটি কনফারেন্স রুম তৈরি করুন অথবা একই রুমের লিংক শেয়ার করুন।
</p>

<input id="room" placeholder="Conference Room Name">

<button class="green" onclick="createRoom()">
🎥 ভিডিও কনফারেন্স চালু করুন
</button>

<button onclick="audioRoom()">
📞 অডিও কনফারেন্স
</button>

<button class="orange" onclick="copyRoom()">
🔗 রুমের লিংক কপি করুন
</button>

</div>

</div>

<script>

let recognition;
let currentRoom = "";
let isListening = false;
let requestNumber = 0;

const languages = {
  bn: "bn-BD",
  en: "en-US",
  de: "de-DE",
  es: "es-ES"
};

// ভাষা পরিবর্তন

function swapLanguages() {

  const source = document.getElementById("source");
  const target = document.getElementById("target");

  const oldSource = source.value;

  source.value = target.value;
  target.value = oldSource;

  const input = document.getElementById("input");
  const output = document.getElementById("output");

  input.value = output.value;
  output.value = "";

  setStatus("ভাষা পরিবর্তন হয়েছে");

}

// Google Translate অনুবাদ

async function translateText() {

  const text = document.getElementById("input").value.trim();

  const source = document.getElementById("source").value;
  const target = document.getElementById("target").value;

  const output = document.getElementById("output");

  if (!text) {
    alert("প্রথমে কিছু লিখুন অথবা কথা বলুন।");
    return;
  }

  if (source === target) {
    alert("দুটি ভাষা আলাদা নির্বাচন করুন।");
    return;
  }

  const thisRequest = ++requestNumber;

  setStatus("Google Translate দিয়ে অনুবাদ হচ্ছে...");

  try {

    const url =
      "https://translate.googleapis.com/translate_a/single" +
      "?client=gtx" +
      "&sl=" + source +
      "&tl=" + target +
      "&dt=t" +
      "&q=" + encodeURIComponent(text);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Translation service unavailable");
    }

    const data = await response.json();

    if (!Array.isArray(data) || !Array.isArray(data[0])) {
      throw new Error("Invalid translation response");
    }

    const translated = data[0]
      .map(item => item && item[0] ? item[0] : "")
      .join("");

    if (!translated.trim()) {
      throw new Error("Empty translation");
    }

    if (thisRequest !== requestNumber) return;

    output.value = translated;

    setStatus("অনুবাদ সম্পন্ন হয়েছে");

  } catch (error) {

    if (thisRequest !== requestNumber) return;

    setStatus("অনুবাদ ব্যর্থ। ইন্টারনেট সংযোগ পরীক্ষা করুন।");

  }

}

// মাইক্রোফোন

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert("Chrome ব্রাউজার ব্যবহার করুন।");

    return;
  }

  if (isListening) return;

  recognition = new SpeechRecognition();

  recognition.lang =
    languages[document.getElementById("source").value];

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {

    let text = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript + " ";
      }

    }

    if (text.trim()) {

      const input = document.getElementById("input");

      input.value += text;

      translateText();

    }

  };

  recognition.onerror = function(event) {

    setStatus("মাইক্রোফোন সমস্যা: " + event.error);

  };

  recognition.onend = function() {

    isListening = false;

    setStatus("মাইক্রোফোন বন্ধ হয়েছে");

  };

  try {

    recognition.start();

    isListening = true;

    setStatus("আপনার কথা শুনছি...");

  } catch (error) {

    setStatus("মাইক্রোফোন চালু করা যায়নি");

  }

}

// মাইক্রোফোন বন্ধ

function stopVoice() {

  if (recognition && isListening) {

    recognition.stop();

    isListening = false;

  }

  setStatus("কথা বলা বন্ধ হয়েছে");

}

// অনুবাদ শুনুন

function speakText() {

  const text = document.getElementById("output").value;

  if (!text) {

    alert("প্রথমে অনুবাদ করুন।");

    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang =
    languages[document.getElementById("target").value];

  speech.rate = 0.9;

  speechSynthesis.speak(speech);

}

// কপি

function copyText() {

  const text = document.getElementById("output").value;

  if (!text) return;

  copyToClipboard(text);

}

// ভিডিও কনফারেন্স

function createRoom() {

  const name = document.getElementById("room").value.trim();

  if (!name) {

    alert("একটি রুমের নাম লিখুন।");

    return;
  }

  currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");

  const link =
    "https://meet.jit.si/" + encodeURIComponent(currentRoom);

  window.open(link, "_blank");

}

// অডিও কনফারেন্স

function audioRoom() {

  const name = document.getElementById("room").value.trim();

  if (!name) {

    alert("একটি রুমের নাম লিখুন।");

    return;
  }

  currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");

  const link =
    "https://meet.jit.si/" +
    encodeURIComponent(currentRoom) +
    "#config.startWithVideoMuted=true";

  window.open(link, "_blank");

}

// রুম লিংক কপি

function copyRoom() {

  const name = document.getElementById("room").value.trim();

  if (!name) {

    alert("প্রথমে রুমের নাম লিখুন।");

    return;
  }

  currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");

  const link =
    "https://meet.jit.si/" + encodeURIComponent(currentRoom);

  copyToClipboard(link);

}

// কপি ফাংশন

async function copyToClipboard(text) {

  try {

    await navigator.clipboard.writeText(text);

    alert("কপি হয়েছে");

  } catch (error) {

    alert("কপি করা যায়নি।");

  }

}

// স্ট্যাটাস

function setStatus(message) {

  document.getElementById("status").innerText = message;

}

</script>

</body>
</html>

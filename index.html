<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Live Translator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #222;
}

.container {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #ccc;
}

h1 {
  text-align: center;
  color: #0759a5;
}

.subtitle {
  text-align: center;
  color: #555;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

select, textarea, input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #0866c6;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  opacity: .7;
}

.green {
  background: #159447;
}

.orange {
  background: #e67e22;
}

.red {
  background: #c0392b;
}

.section {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

#status {
  text-align: center;
  margin-top: 12px;
  color: #087a37;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 Smart Live Translator</h1>

<p class="subtitle">
চার ভাষায় কথা বলুন এবং অনুবাদ শুনুন
</p>

<label>আপনার ভাষা</label>

<select id="source">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<label>যে ভাষায় অনুবাদ চান</label>

<select id="target">
<option value="en">English</option>
<option value="bn">বাংলা</option>
<option value="de">Deutsch (German)</option>
<option value="es">Español (Spanish)</option>
</select>

<label>আপনার কথা অথবা লেখা</label>

<textarea id="input" placeholder="এখানে লিখুন অথবা মাইক্রোফোনে কথা বলুন"></textarea>

<button onclick="translateText()">
🌐 অনুবাদ করুন
</button>

<button class="green" onclick="startVoice()">
🎤 কথা বলুন
</button>

<button class="red" onclick="stopVoice()">
⏹ কথা বলা বন্ধ
</button>

<label>অনুবাদের ফলাফল</label>

<textarea id="output" readonly placeholder="অনুবাদ এখানে দেখা যাবে"></textarea>

<button class="orange" onclick="speakText()">
🔊 অনুবাদ শুনুন
</button>

<button onclick="copyText()">
📋 কপি করুন
</button>

<div id="status">প্রস্তুত</div>

<div class="section">

<h2>📞 অডিও ও ভিডিও কল</h2>

<p>একটি কনফারেন্স রুম তৈরি করুন অথবা একই রুমের লিংক শেয়ার করুন।</p>

<input id="room" placeholder="Conference Room Name">

<button class="green" onclick="createRoom()">
🎥 ভিডিও কনফারেন্স চালু করুন
</button>

<button onclick="audioRoom()">
📞 অডিও কনফারেন্স
</button>

<button class="orange" onclick="copyRoom()">
🔗 রুমের লিংক কপি করুন
</button>

</div>

</div>

<script>

let recognition;
let currentRoom = "";

const languages = {
  bn: "bn-BD",
  en: "en-US",
  de: "de-DE",
  es: "es-ES"
};

async function translateText() {

  const text = document.getElementById("input").value.trim();

  const source = document.getElementById("source").value;
  const target = document.getElementById("target").value;

  if (!text) {
    alert("প্রথমে কিছু লিখুন অথবা কথা বলুন।");
    return;
  }

  if (source === target) {
    alert("দুটি ভাষা আলাদা নির্বাচন করুন।");
    return;
  }

  document.getElementById("status").innerText =
    "অনুবাদ হচ্ছে...";

  try {

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + source + "|" + target;

    const response = await fetch(url);

    const data = await response.json();

    if (data.responseStatus !== 200) {
      throw new Error("Translation failed");
    }

    document.getElementById("output").value =
      data.responseData.translatedText;

    document.getElementById("status").innerText =
      "অনুবাদ সম্পন্ন হয়েছে";

  } catch (error) {

    document.getElementById("status").innerText =
      "অনুবাদ করা যায়নি। ইন্টারনেট পরীক্ষা করুন।";

  }
}

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("আপনার ব্রাউজারে Voice Recognition সমর্থিত নয়। Chrome ব্যবহার করুন।");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    languages[document.getElementById("source").value];

  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {

    let text = "";

    for (let i = event.resultIndex;
         i < event.results.length; i++) {

      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript + " ";
      }

    }

    if (text.trim()) {

      const input = document.getElementById("input");

      input.value += text;

      translateText();

    }

  };

  recognition.onerror = function() {
    document.getElementById("status").innerText =
      "মাইক্রোফোনে সমস্যা হয়েছে";
  };

  recognition.onend = function() {
    document.getElementById("status").innerText =
      "মাইক্রোফোন বন্ধ হয়েছে";
  };

  recognition.start();

  document.getElementById("status").innerText =
    "আপনার কথা শুনছি...";

}

function stopVoice() {

  if (recognition) {
    recognition.stop();
  }

  document.getElementById("status").innerText =
    "কথা বলা বন্ধ হয়েছে";

}

function speakText() {

  const text = document.getElementById("output").value;

  if (!text) {
    alert("প্রথমে অনুবাদ করুন।");
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang =
    languages[document.getElementById("target").value];

  speech.rate = 0.9;

  speechSynthesis.speak(speech);

}

function copyText() {

  const text = document.getElementById("output").value;

  if (!text) return;

  navigator.clipboard.writeText(text)
    .then(() => alert("কপি হয়েছে"))
    .catch(() => alert("কপি করা যায়নি"));

}

function createRoom() {

  const name = document.getElementById("room").value.trim();

  if (!name) {
    alert("একটি রুমের নাম লিখুন।");
    return;
  }

  currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");

  window.open(
    "https://meet.jit.si/" +
    encodeURIComponent(currentRoom),
    "_blank"
  );

}

function audioRoom() {

  const name = document.getElementById("room").value.trim();

  if (!name) {
    alert("একটি রুমের নাম লিখুন।");
    return;
  }

  currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");

  window.open(
    "https://meet.jit.si/" +
    encodeURIComponent(currentRoom) +
    "#config.startWithVideoMuted=true",
    "_blank"
  );

}

function copyRoom() {

  if (!currentRoom) {
    const name = document.getElementById("room").value.trim();

    if (!name) {
      alert("প্রথমে রুমের নাম লিখুন।");
      return;
    }

    currentRoom = name.replace(/[^a-zA-Z0-9_-]/g, "-");
  }

  const link = "https://meet.jit.si/" + encodeURIComponent(currentRoom);

  navigator.clipboard.writeText(link)
    .then(() => alert("কনফারেন্স লিংক কপি হয়েছে।"))
    .catch(() => alert("লিংক কপি করা যায়নি।"));

}

</script>

</body>
</html>
